name: Release

# Publica binários + checksums.txt quando uma tag vX.Y.Z é enviada, ou pelo botão
# "Run workflow" (Actions → Release) informando a versão: aí o próprio workflow cria a tag
# no commit escolhido. O comando `likedsorter update` baixa estes arquivos e confere o SHA-256.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex.: v1.0.0) — a tag é criada no commit do branch escolhido"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      # Tag da release: a enviada (push) ou a informada no disparo manual.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x" # o go.mod continua exigindo só 1.22; 1.22 gera binários que o macOS atual recusa (LC_UUID)
      - name: Validar versão
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "versão inválida: $TAG (use vX.Y.Z)"; exit 1; }
      - name: Testes
        run: go test -count=1 ./...
      - name: Compilar todas as plataformas
        run: |
          version="${TAG}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "dist/likedsorter_${os}_${arch}${ext}" ./cmd/likedsorter
          done
          (cd dist && sha256sum likedsorter_* > checksums.txt && cat checksums.txt)
      - name: Manifest do Scoop (instalação com um comando no Windows)
        run: |
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          h64="$(grep ' likedsorter_windows_amd64.exe$' dist/checksums.txt | cut -d' ' -f1)"
          harm="$(grep ' likedsorter_windows_arm64.exe$' dist/checksums.txt | cut -d' ' -f1)"
          cat > dist/likedsorter.json <<EOF
          {
            "version": "${version}",
            "description": "Organiza suas músicas curtidas do Spotify em playlists (CLI)",
            "homepage": "https://github.com/${GITHUB_REPOSITORY}",
            "license": "MIT",
            "architecture": {
              "64bit": { "url": "${base}/likedsorter_windows_amd64.exe#/likedsorter.exe", "hash": "${h64}" },
              "arm64": { "url": "${base}/likedsorter_windows_arm64.exe#/likedsorter.exe", "hash": "${harm}" }
            },
            "bin": "likedsorter.exe",
            "checkver": "github"
          }
          EOF
          sed -i 's/^          //' dist/likedsorter.json
          cat dist/likedsorter.json
      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target só vale quando a tag ainda não existe (disparo manual): cria no commit atual.
          gh release create "${TAG}" dist/* \
            --title "${TAG}" --generate-notes --target "${GITHUB_SHA}"
